<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ff8fb3" />
    <title>Aduke's Town</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <span id="moves"></span>
      <span id="goal"></span>
      <button id="pause-btn" type="button">Pause</button>
    </div>

    <div id="pause-overlay" class="overlay" hidden>
      <div class="overlay-panel">
        <p>Paused</p>
        <label class="relax-mode-label">
          <input type="checkbox" id="relax-mode-toggle" />
          Relax mode (more moves)
        </label>
        <button id="resume-btn" type="button">Resume</button>
      </div>
    </div>

    <div id="result-modal" class="overlay" hidden>
      <div class="overlay-panel">
        <h2 id="result-title"></h2>
        <p id="result-progress"></p>
        <button id="play-again-btn" type="button">Play Again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
