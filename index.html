<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#ff8fb3" />
    <title>Aduke's Town</title>
    <link rel="icon" type="image/png" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="rotate-hint" aria-hidden="true">
      <div class="rotate-hint-inner">
        <span class="rotate-hint-icon">📱↻</span>
        <p>Rotate your device</p>
        <p class="rotate-hint-sub">Aduke's Town plays in landscape</p>
      </div>
    </div>

    <div id="city-app"></div>

    <div id="app"></div>

    <div id="hud">
      <span id="moves"></span>
      <span id="goal"></span>
      <button id="pause-btn" type="button">
        <img src="/icons/pause.png" alt="" />
        Pause
      </button>
    </div>

    <div id="pause-overlay" class="overlay" hidden>
      <div class="overlay-panel">
        <p>Paused</p>
        <label class="relax-mode-label">
          <input type="checkbox" id="relax-mode-toggle" />
          Relax mode (more moves)
        </label>
        <button id="resume-btn" type="button">Resume</button>
        <button id="back-to-town-btn" type="button">
          <img src="/icons/home.png" alt="" />
          Back to Town
        </button>
      </div>
    </div>

    <div id="result-modal" class="overlay" hidden>
      <div class="overlay-panel">
        <h2 id="result-title"></h2>
        <p id="result-progress"></p>
        <button id="play-again-btn" type="button">Play Again</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
